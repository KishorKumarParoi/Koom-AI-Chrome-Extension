<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KoomAI Studio — Recorded Video Preview</title>
    <style>
      :root {
        --bg-color: #0b0f19;
        --card-bg: rgba(22, 28, 45, 0.75);
        --accent-purple: #7928ca;
        --accent-pink: #ff0080;
        --accent-cyan: #00dfd8;
        --text-primary: #f3f4f6;
        --text-secondary: #9ca3af;
        --border-color: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body {
        background-color: var(--bg-color);
        background-image: 
          radial-gradient(at 0% 0%, rgba(121, 40, 202, 0.25) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(255, 0, 128, 0.2) 0px, transparent 50%);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px 16px;
      }

      header {
        width: 100%;
        max-width: 1080px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border-color);
        margin-bottom: 24px;
      }

      .logo-group {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo-badge {
        background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
        width: 38px;
        height: 38px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 20px;
        color: white;
        box-shadow: 0 4px 14px rgba(255, 0, 128, 0.4);
      }

      .logo-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .logo-title span {
        background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .status-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(16, 185, 129, 0.15);
        color: #10b981;
        border: 1px solid rgba(16, 185, 129, 0.3);
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        background-color: #10b981;
        border-radius: 50%;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.8; }
        50% { transform: scale(1.2); opacity: 1; }
        100% { transform: scale(0.95); opacity: 0.8; }
      }

      .main-container {
        width: 100%;
        max-width: 1080px;
        background: var(--card-bg);
        backdrop-filter: blur(16px);
        border: 1px solid var(--border-color);
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .video-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 16/9;
        border-radius: 12px;
        overflow: hidden;
        background: black;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      }

      #recorded-video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .controls-bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding-top: 10px;
      }

      .meta-info {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 13px;
        color: var(--text-secondary);
      }

      .meta-badge {
        background: rgba(255, 255, 255, 0.08);
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .actions-group {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        border: none;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
        color: white;
        box-shadow: 0 4px 14px rgba(255, 0, 128, 0.3);
      }

      .btn-primary:hover {
        opacity: 0.92;
        transform: translateY(-1px);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.16);
      }

      #upload-toast {
        display: none;
        padding: 14px 18px;
        border-radius: 10px;
        font-size: 13px;
        background: rgba(59, 130, 246, 0.15);
        border: 1px solid rgba(59, 130, 246, 0.3);
        color: #93c5fd;
      }

      #upload-toast.success {
        display: block;
        background: rgba(16, 185, 129, 0.15);
        border-color: rgba(16, 185, 129, 0.3);
        color: #6ee7b7;
      }

      #upload-toast.error {
        display: block;
        background: rgba(239, 68, 68, 0.15);
        border-color: rgba(239, 68, 68, 0.3);
        color: #fca5a5;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo-group">
        <div class="logo-badge">K</div>
        <div class="logo-title">Koom<span>AI</span> Studio</div>
      </div>
      <div class="status-pill">
        <div class="status-dot"></div>
        <span>Capture Finished</span>
      </div>
    </header>

    <div class="main-container">
      <div class="video-wrapper">
        <video id="recorded-video" controls autoplay playsinline></video>
      </div>

      <div class="controls-bar">
        <div class="meta-info">
          <span class="meta-badge" id="video-format">Format: WebM (VP9 / Opus)</span>
          <span class="meta-badge" id="video-time">Duration: Calculating...</span>
          <span class="meta-badge" id="video-fps">FPS: 60 FPS</span>
        </div>

        <div class="actions-group">
          <button class="btn-primary" id="btn-upload">
            <span>🚀 Upload to KoomAI Cloud</span>
          </button>
          <button class="btn-secondary" id="btn-download">
            <span>📥 Download WebM</span>
          </button>
          <button class="btn-secondary" id="btn-web-app">
            <span>🌐 Open Dashboard (:3000)</span>
          </button>
        </div>
      </div>

      <div id="upload-toast"></div>
    </div>

    <script src="video.js"></script>
  </body>
</html>
